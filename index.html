<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер привычек</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #262a33;
    --text: #e8eaef;
    --muted: #8b90a0;
    --accent: #7c5cff;
    --done: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app { width: 100%; max-width: 680px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .subtitle { color: var(--muted); margin: 0 0 24px; }

  .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .add-form input { min-width: 160px; }
  .add-form input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .add-form input:focus { border-color: var(--accent); }
  .add-form select {
    padding: 12px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
  }
  .sched { color: var(--muted); font-weight: 400; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 16px;
  }
  .add-form button {
    padding: 12px 18px;
    background: var(--accent);
    color: white;
    font-weight: 600;
  }
  .add-form button:hover { filter: brightness(1.1); }

  .days-header, .habit {
    display: grid;
    grid-template-columns: 1fr repeat(7, 36px) 56px 32px;
    gap: 6px;
    align-items: center;
  }
  .days-header {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    padding: 0 12px 8px;
  }
  .days-header .today { color: var(--accent); font-weight: 700; }

  .habit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .habit-name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: transparent;
    font-size: 18px;
    transition: transform 0.1s;
  }
  .day:hover { transform: scale(1.08); }
  .day.done { background: var(--done); border-color: var(--done); color: white; }
  .day.missed {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.35);
    color: var(--danger);
    font-size: 14px;
  }
  .day:disabled { cursor: default; }
  .day:disabled:hover { transform: none; }
  .day.locked { opacity: 0.35; }
  .day.today:not(.done) { border-color: var(--accent); }
  .streak { text-align: center; font-size: 14px; color: var(--muted); }
  .streak.hot { color: #f59e0b; font-weight: 700; }
  .streak.weekly { color: var(--done); font-weight: 700; } /* серия в неделях */
  .delete {
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    width: 32px;
    height: 32px;
  }
  .delete:hover { color: var(--danger); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }
  .habit-name { cursor: pointer; }
  .habit-name:hover { color: var(--accent); }
  .habit-name::before { content: "▸ "; color: var(--muted); }
  .habit.open .habit-name::before { content: "▾ "; }
  .habit.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0; }

  .calendar {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 12px 16px 16px;
    margin-bottom: 8px;
  }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    width: 32px; height: 32px;
  }
  .cal-nav button:disabled { opacity: 0.3; cursor: default; }
  .cal-title { font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-wd { text-align: center; font-size: 12px; color: var(--muted); }
  .cal-day {
    height: 40px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-day.done { background: var(--done); border-color: var(--done); color: white; font-weight: 600; }
  .cal-day.missed { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); color: var(--danger); }
  .cal-day.locked { opacity: 0.35; }
  .cal-day.today { border-color: var(--accent); color: var(--text); cursor: pointer; }
  .cal-day.today.done { border-color: var(--done); }
  .cal-day.blank { background: transparent; border: none; }
  .cal-summary { margin-top: 12px; font-size: 14px; color: var(--muted); text-align: center; }
  .cal-summary b { color: var(--text); }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px 4px; text-align: center; }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 13px; }

  @media (max-width: 520px) {
    .days-header, .habit { grid-template-columns: 1fr repeat(7, 28px) 40px 28px; gap: 4px; }
    .day { width: 28px; height: 28px; font-size: 14px; }
    .habit { padding: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Трекер привычек</h1>
  <p class="subtitle">Отмечай каждый день и не ломай серию 🔥</p>

  <form class="add-form" id="addForm">
    <input id="habitInput" type="text" placeholder="Например: читать 20 минут" maxlength="40" autocomplete="off">
    <select id="scheduleInput" title="Как часто делать привычку">
      <option value="daily">Каждый день</option>
      <option value="weekdays">По будням</option>
      <option value="w1">1 раз в неделю</option>
      <option value="w2">2 раза в неделю</option>
      <option value="w3">3 раза в неделю</option>
      <option value="w4">4 раза в неделю</option>
      <option value="w5">5 раз в неделю</option>
      <option value="w6">6 раз в неделю</option>
    </select>
    <button type="submit">Добавить</button>
  </form>

  <div class="days-header" id="daysHeader"></div>
  <div id="habitList"></div>

  <div class="add-form" style="margin-top:24px">
    <input id="remTime" type="time" value="20:00" title="Во сколько напоминать">
    <button type="button" id="remBtn">⏰ Напоминание в календарь</button>
  </div>

  <div class="add-form" style="margin-top:12px">
    <button type="button" id="exportBtn">💾 Скачать копию данных</button>
    <button type="button" id="importBtn">📂 Загрузить копию</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <footer>Данные хранятся в твоём браузере</footer>
</div>

<script>
  // ---------- Хранилище ----------
  const STORAGE_KEY = "habits-v1";

  function loadHabits() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveHabits() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    } catch (e) { /* хранилище недоступно, просто пропускаем */ }
  }

  let habits = loadHabits();

  // ---------- Даты ----------
  // Превращаем дату в строку вида 2026-11-03
  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  // Последние 7 дней, сегодня последним
  function lastSevenDays() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    return days;
  }

  const WEEKDAYS = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];

  // ---------- Расписание ----------
  // habit.schedule: {type:"daily"} | {type:"weekdays"} | {type:"weekly", n}
  // У старых привычек расписания нет — считаем «каждый день».
  function getSchedule(habit) { return habit.schedule || { type: "daily" }; }
  function isWeekly(habit) { return getSchedule(habit).type === "weekly"; }

  // Обязателен ли этот день. В режиме «N раз в неделю» обязательных дней нет.
  function isScheduled(habit, d) {
    const type = getSchedule(habit).type;
    if (type === "weekdays") return d.getDay() !== 0 && d.getDay() !== 6;
    return type === "daily";
  }

  function scheduleLabel(habit) {
    const s = getSchedule(habit);
    if (s.type === "weekdays") return "по будням";
    if (s.type === "weekly") return `${s.n}× в неделю`;
    return "";
  }

  // Понедельник той недели, в которой лежит дата
  function weekStart(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    return d;
  }

  // Сколько отметок в текущей неделе (пн–вс)
  function weekCount(habit) {
    const w = weekStart(new Date());
    let count = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(w);
      d.setDate(w.getDate() + i);
      if (habit.days[dateKey(d)]) count++;
    }
    return count;
  }

  // Итог каждой недели (пн–вс) от недели создания до текущей: "ok" | "fail" | "skip".
  // "skip" — неделя ещё идёт или привычка создана посреди неё: штрафа нет.
  function weekResults(habit) {
    const n = getSchedule(habit).n;
    const created = weekStart(new Date(habit.id)).getTime();
    const cur = weekStart(new Date()).getTime();
    const res = [];
    for (const w = new Date(created); w.getTime() <= cur; w.setDate(w.getDate() + 7)) {
      let count = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(w);
        d.setDate(w.getDate() + i);
        if (habit.days[dateKey(d)]) count++;
      }
      const t = w.getTime();
      res.push(count >= n ? "ok" : (t === created || t === cur) ? "skip" : "fail");
    }
    return res;
  }

  // Серия: сколько дней подряд привычка выполнена (для «N раз в неделю» — недель)
  function getStreak(habit) {
    if (isWeekly(habit)) {
      const w = weekResults(habit);
      if (w[w.length - 1] === "skip") w.pop();
      let streak = 0;
      while (w.length && w.pop() === "ok") streak++;
      return streak;
    }
    const createdKey = dateKey(new Date(habit.id));
    let streak = 0;
    const d = new Date();
    // если сегодня ещё не отмечено, считаем от вчера
    if (!habit.days[dateKey(d)]) d.setDate(d.getDate() - 1);
    for (; dateKey(d) >= createdKey; d.setDate(d.getDate() - 1)) {
      if (habit.days[dateKey(d)]) streak++;
      else if (isScheduled(habit, d)) break; // необязательные дни (выходные) серию не рвут
    }
    return streak;
  }

  // Статистика за всё время: со дня создания по сегодня.
  // Неотмеченное сегодня не считаем пропуском — день ещё не закончился.
  function getStats(habit) {
    if (isWeekly(habit)) {
      let best = 0, run = 0, ok = 0, fail = 0;
      weekResults(habit).forEach(r => {
        if (r === "ok") { ok++; run++; best = Math.max(best, run); }
        else if (r === "fail") { fail++; run = 0; }
      });
      return { done: Object.keys(habit.days).length, best, pct: ok + fail ? Math.round(ok / (ok + fail) * 100) : 0 };
    }
    const todayKey = dateKey(new Date());
    const d = new Date(habit.id);
    let done = 0, total = 0, best = 0, run = 0;
    for (let key = dateKey(d); key <= todayKey; d.setDate(d.getDate() + 1), key = dateKey(d)) {
      if (habit.days[key]) {
        done++; total++; run++;
        best = Math.max(best, run);
      } else if (key !== todayKey && isScheduled(habit, d)) {
        total++; run = 0;
      }
    }
    return { done, best, pct: total ? Math.round(done / total * 100) : 0 };
  }

  // ---------- Отрисовка ----------
  // Напоминание: готовые .ics на сайте (iOS Safari сам предлагает добавить в Календарь).
  // shortcut: файлы на каждую минуту лежат в reminders/, одно общее напоминание, не знает что уже отмечено.
  document.getElementById('remBtn').onclick = function () {
    location.href = 'reminders/' + (document.getElementById('remTime').value || '20:00').replace(':', '') + '.ics';
  };

  function render() {
    const days = lastSevenDays();
    const todayKey = dateKey(new Date());

    // Заголовок с днями недели
    const header = document.getElementById("daysHeader");
    header.innerHTML = "<span></span>" +
      days.map(d => `<span class="${dateKey(d) === todayKey ? "today" : ""}">${WEEKDAYS[d.getDay()]}<br>${d.getDate()}</span>`).join("") +
      "<span>🔥</span><span></span>";
    header.style.display = habits.length ? "grid" : "none";

    // Список привычек
    const list = document.getElementById("habitList");
    if (habits.length === 0) {
      list.innerHTML = `<div class="empty">Пока нет привычек. Добавь первую ☝️</div>`;
      return;
    }

    list.innerHTML = "";
    habits.forEach(habit => {
      const row = document.createElement("div");
      row.className = "habit";

      const isOpen = openHabitId === habit.id;
      if (isOpen) row.classList.add("open");

      const name = document.createElement("div");
      name.className = "habit-name";
      name.textContent = habit.name;
      if (scheduleLabel(habit)) {
        const tag = document.createElement("small");
        tag.className = "sched";
        tag.textContent = " · " + scheduleLabel(habit) + (isWeekly(habit) ? ` · на этой неделе ${weekCount(habit)}/${getSchedule(habit).n}` : "");
        name.appendChild(tag);
      }
      name.title = "Открыть календарь";
      name.onclick = () => {
        if (isOpen) {
          openHabitId = null;
        } else {
          openHabitId = habit.id;
          const now = new Date();
          calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        }
        render();
      };
      row.appendChild(name);

      const createdKey = dateKey(new Date(habit.id));

      days.forEach(d => {
        const key = dateKey(d);
        const done = !!habit.days[key];
        const isToday = key === todayKey;
        const btn = document.createElement("button");
        btn.className = "day" + (done ? " done" : "") + (isToday ? " today" : "");
        btn.textContent = "✓";
        btn.title = key;

        // Отмечать можно только сегодняшний день — прошлое уже не изменить
        if (!isToday) {
          btn.disabled = true;
          if (!done && key >= createdKey && isScheduled(habit, d)) {
            btn.classList.add("missed");
            btn.textContent = "✕";
            btn.title = key + " — пропущено";
          } else if (!done) {
            btn.classList.add("locked");
            btn.title = key < createdKey ? key + " — привычки ещё не было" : key + " — необязательный день";
          }
          row.appendChild(btn);
          return;
        }

        btn.onclick = () => {
          if (habit.days[key]) delete habit.days[key];
          else habit.days[key] = true;
          saveHabits();
          render();
        };
        row.appendChild(btn);
      });

      const streak = getStreak(habit);
      const streakEl = document.createElement("div");
      streakEl.className = "streak" + (isWeekly(habit) ? " weekly" : streak >= 3 ? " hot" : "");
      streakEl.textContent = streak;
      row.appendChild(streakEl);

      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "✕";
      del.title = "Удалить";
      del.onclick = () => {
        if (confirm(`Удалить привычку «${habit.name}»?`)) {
          habits = habits.filter(h => h.id !== habit.id);
          saveHabits();
          render();
        }
      };
      row.appendChild(del);

      list.appendChild(row);
      if (isOpen) list.appendChild(renderCalendar(habit));
    });
  }

  // ---------- Календарь ----------
  const MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  let openHabitId = null;
  let calMonth = null; // первое число показываемого месяца

  function toggleToday(habit) {
    const key = dateKey(new Date());
    if (habit.days[key]) delete habit.days[key];
    else habit.days[key] = true;
    saveHabits();
    render();
  }

  function renderCalendar(habit) {
    const todayKey = dateKey(new Date());
    const created = new Date(habit.id);
    const createdKey = dateKey(created);
    const year = calMonth.getFullYear();
    const month = calMonth.getMonth();
    const now = new Date();

    const wrap = document.createElement("div");
    wrap.className = "calendar";

    // Навигация по месяцам: не раньше месяца создания и не позже текущего
    const canPrev = year > created.getFullYear() ||
      (year === created.getFullYear() && month > created.getMonth());
    const canNext = year < now.getFullYear() ||
      (year === now.getFullYear() && month < now.getMonth());

    const nav = document.createElement("div");
    nav.className = "cal-nav";
    const prev = document.createElement("button");
    prev.textContent = "‹";
    prev.title = "Предыдущий месяц";
    prev.disabled = !canPrev;
    prev.onclick = () => { calMonth = new Date(year, month - 1, 1); render(); };
    const title = document.createElement("div");
    title.className = "cal-title";
    title.textContent = `${MONTHS[month]} ${year}`;
    const next = document.createElement("button");
    next.textContent = "›";
    next.title = "Следующий месяц";
    next.disabled = !canNext;
    next.onclick = () => { calMonth = new Date(year, month + 1, 1); render(); };
    nav.append(prev, title, next);
    wrap.appendChild(nav);

    const grid = document.createElement("div");
    grid.className = "cal-grid";
    ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"].forEach(w => {
      const el = document.createElement("div");
      el.className = "cal-wd";
      el.textContent = w;
      grid.appendChild(el);
    });

    // Пустые клетки до первого числа (неделя начинается с понедельника)
    const offset = (new Date(year, month, 1).getDay() + 6) % 7;
    for (let i = 0; i < offset; i++) {
      const el = document.createElement("div");
      el.className = "cal-day blank";
      grid.appendChild(el);
    }

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    let doneCount = 0, countable = 0;
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      const key = dateKey(date);
      const done = !!habit.days[key];
      const el = document.createElement("div");
      el.className = "cal-day";
      el.textContent = day;
      el.title = key;

      if (done) el.classList.add("done");
      if (key === todayKey) {
        el.classList.add("today");
        el.title = "Сегодня — нажми, чтобы отметить";
        el.onclick = () => toggleToday(habit);
      } else if (key > todayKey || key < createdKey) {
        if (!done) el.classList.add("locked");
      } else if (!done) {
        if (isScheduled(habit, date)) {
          el.classList.add("missed");
          el.title = key + " — пропущено";
        } else {
          el.classList.add("locked");
          el.title = key + " — необязательный день";
        }
      }

      if (key >= createdKey && key <= todayKey && (done || (key !== todayKey && isScheduled(habit, date)))) {
        countable++;
        if (done) doneCount++;
      }
      grid.appendChild(el);
    }
    wrap.appendChild(grid);

    const summary = document.createElement("div");
    summary.className = "cal-summary";
    const pct = countable ? Math.round(doneCount / countable * 100) : 0;
    summary.innerHTML = isWeekly(habit)
      ? `Выполнено <b>${doneCount}</b> дн. за месяц · цель <b>${getSchedule(habit).n}</b> в неделю`
      : `Выполнено <b>${doneCount}</b> из <b>${countable}</b> дней · <b>${pct}%</b>`;
    wrap.appendChild(summary);

    const stats = getStats(habit);
    const unit = isWeekly(habit) ? ", нед." : "";
    const statsEl = document.createElement("div");
    statsEl.className = "stats";
    [
      [getStreak(habit), "Серия 🔥" + unit],
      [stats.best, "Рекорд" + unit],
      [stats.done, "Всего дней"],
      [stats.pct + "%", "За всё время"],
    ].forEach(([value, label]) => {
      const el = document.createElement("div");
      el.className = "stat";
      el.innerHTML = `<div class="stat-value">${value}</div><div class="stat-label">${label}</div>`;
      statsEl.appendChild(el);
    });
    wrap.appendChild(statsEl);

    // Правка привычки: название и расписание
    const edit = document.createElement("form");
    edit.className = "add-form";
    edit.style.marginTop = "14px";
    const nameIn = document.createElement("input");
    nameIn.value = habit.name;
    nameIn.maxLength = 40;
    const schedIn = document.getElementById("scheduleInput").cloneNode(true);
    const s = getSchedule(habit);
    schedIn.value = s.type === "weekly" ? "w" + s.n : s.type;
    const save = document.createElement("button");
    save.textContent = "Сохранить";
    edit.append(nameIn, schedIn, save);
    edit.onsubmit = e => {
      e.preventDefault();
      const name = nameIn.value.trim();
      if (!name) return;
      const v = schedIn.value;
      habit.name = name;
      habit.schedule = v[0] === "w" ? { type: "weekly", n: +v.slice(1) } : { type: v };
      saveHabits();
      render();
    };
    wrap.appendChild(edit);

    return wrap;
  }

  // ---------- Добавление ----------
  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("habitInput");
    const name = input.value.trim();
    if (!name) return;
    const v = document.getElementById("scheduleInput").value; // "daily" | "weekdays" | "w3"
    const schedule = v[0] === "w" ? { type: "weekly", n: +v.slice(1) } : { type: v };
    habits.push({ id: Date.now(), name, days: {}, schedule });
    input.value = "";
    saveHabits();
    render();
  });

  // ---------- Резервная копия ----------
  document.getElementById("exportBtn").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(habits, null, 2)], { type: "application/json" }));
    a.download = `habits-${dateKey(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();

  document.getElementById("importFile").onchange = async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const ok = Array.isArray(data) && data.every(h =>
        h && typeof h.name === "string" && Number.isFinite(h.id) && h.days && typeof h.days === "object");
      if (!ok) throw new Error("bad format");
      if (!confirm(`Заменить текущие привычки (${habits.length}) на привычки из файла (${data.length})?`)) return;
      habits = data;
      saveHabits();
      render();
    } catch (err) {
      alert("Не получилось прочитать файл. Нужен файл, скачанный из этого приложения.");
    }
  };

  render();

  // Установка на телефон и офлайн-режим. Работает только по https или localhost, с диска (file://) — нет.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
